<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" role="img" aria-labelledby="title desc"><title id="title">Enterprise workflow — illustrative preview</title><desc id="desc">Defined states, approval stages and audit snapshots. Static illustration, not a live calendar or product screenshot.</desc><style>text{font-family:Arial,sans-serif;fill:#224335}.label{font-size:13px;font-weight:600}.sub{font-size:10px;fill:#5b6f62}.event{font-size:11px}</style><rect x="1" y="1" width="658" height="378" rx="10" fill="#fff" stroke="#dce5df"/><text x="28" y="34" font-size="18" font-weight="600">Enterprise workflow</text><text x="28" y="55" class="sub">Defined states, approval stages and audit snapshots</text><path d="M1 70 H659" stroke="#dce5df"/><text x="28" y="117" class="sub">EVENT APPROVAL</text><rect x="28" y="135" width="173" height="62" rx="8" fill="#e7edf5"/><text x="48" y="161" class="label">Draft</text><text x="48" y="181" class="sub">Event created</text><path d="M205 167 H236" stroke="#91aa9a" stroke-width="2"/><rect x="241" y="135" width="174" height="62" rx="8" fill="#fcf2d8"/><text x="261" y="161" class="label">In review</text><text x="261" y="181" class="sub">Manager approval</text><path d="M419 167 H448" stroke="#91aa9a" stroke-width="2"/><rect x="454" y="135" width="174" height="62" rx="8" fill="#dcecdf"/><text x="474" y="161" class="label">Approved</text><text x="474" y="181" class="sub">Ready to schedule</text><text x="28" y="242" class="sub">WORKFLOW CAPABILITIES</text><rect x="28" y="258" width="600" height="82" rx="8" fill="#f6f8f4" stroke="#dce5df"/><text x="46" y="287" class="label">Field policies</text><text x="46" y="314" class="sub">Control permitted edits</text><text x="247" y="287" class="label">Audit snapshots</text><text x="247" y="314" class="sub">Preserve change history</text><text x="448" y="287" class="label">Mutation queue</text><text x="448" y="314" class="sub">Reconcile pending edits</text></svg>
