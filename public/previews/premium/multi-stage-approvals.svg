<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">Review in the right order</title><desc id="desc">Approval stages are explicit and customer-configured. Submitted, Manager review, Director review, Ready to commit. Static illustration, not a live calendar or product screenshot.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#13685a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="1" y="1" width="1118" height="638" rx="18" fill="#f7faf7" stroke="#d6e3dc"/><rect x="24" y="24" width="1072" height="592" rx="14" fill="#fff" stroke="#d6e3dc"/><text x="64" y="86" font-size="27" fill="#183d33" font-weight="600">Review in the right order</text><text x="64" y="122" font-size="18" fill="#597168" font-weight="400">Approval stages are explicit and customer-configured</text><rect x="64" y="240" width="236" height="92" rx="10" fill="#d9ece2" stroke="#d6e3dc"/><text x="84" y="278" font-size="18" fill="#183d33" font-weight="600">Submitted</text><text x="84" y="306" font-size="14" fill="#597168" font-weight="400">Step 1</text><path d="M302 286H311" fill="none" stroke="#13685a" stroke-width="2" marker-end="url(#arrow)"/><rect x="316" y="240" width="236" height="92" rx="10" fill="#e2eaf6" stroke="#d6e3dc"/><text x="336" y="278" font-size="18" fill="#183d33" font-weight="600">Manager review</text><text x="336" y="306" font-size="14" fill="#597168" font-weight="400">Step 2</text><path d="M554 286H563" fill="none" stroke="#13685a" stroke-width="2" marker-end="url(#arrow)"/><rect x="568" y="240" width="236" height="92" rx="10" fill="#f8ecd0" stroke="#d6e3dc"/><text x="588" y="278" font-size="18" fill="#183d33" font-weight="600">Director review</text><text x="588" y="306" font-size="14" fill="#597168" font-weight="400">Step 3</text><path d="M806 286H815" fill="none" stroke="#13685a" stroke-width="2" marker-end="url(#arrow)"/><rect x="820" y="240" width="236" height="92" rx="10" fill="#ece4f3" stroke="#d6e3dc"/><text x="840" y="278" font-size="18" fill="#183d33" font-weight="600">Ready to commit</text><text x="840" y="306" font-size="14" fill="#597168" font-weight="400">Step 4</text><text x="64" y="439" font-size="18" fill="#597168" font-weight="400">Actor and role selectors determine who can approve</text><text x="64" y="589" font-size="14" fill="#597168" font-weight="400">Sample data · feature concept, not a product screenshot</text><text x="64" y="612" font-size="11" fill="#597168" font-weight="600">WTS CALENDAR  /  PREMIUM  /  STATIC ILLUSTRATION</text></svg>
