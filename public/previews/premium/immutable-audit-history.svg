<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">A linked history of workflow actions</title><desc id="desc">Immutable snapshots with verifiable chain relationships. Created · #001, Submitted · #002, Approved · #003. Static illustration, not a live calendar or product screenshot.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#13685a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="1" y="1" width="1118" height="638" rx="18" fill="#f7faf7" stroke="#d6e3dc"/><rect x="24" y="24" width="1072" height="592" rx="14" fill="#fff" stroke="#d6e3dc"/><text x="64" y="86" font-size="27" fill="#183d33" font-weight="600">A linked history of workflow actions</text><text x="64" y="122" font-size="18" fill="#597168" font-weight="400">Immutable snapshots with verifiable chain relationships</text><rect x="64" y="210" width="288" height="92" rx="10" fill="#d9ece2" stroke="#d6e3dc"/><text x="84" y="248" font-size="18" fill="#183d33" font-weight="600">Created · #001</text><text x="84" y="276" font-size="14" fill="#597168" font-weight="400">Actor · action · version</text><rect x="64" y="328" width="288" height="54" rx="6" fill="#f5f8f6" stroke="#d6e3dc"/><text x="84" y="362" font-size="16" fill="#183d33" font-weight="400">Origin → first hash</text><path d="M354 355H404" fill="none" stroke="#13685a" stroke-width="2" marker-end="url(#arrow)"/><rect x="416" y="210" width="288" height="92" rx="10" fill="#e2eaf6" stroke="#d6e3dc"/><text x="436" y="248" font-size="18" fill="#183d33" font-weight="600">Submitted · #002</text><text x="436" y="276" font-size="14" fill="#597168" font-weight="400">Actor · action · version</text><rect x="416" y="328" width="288" height="54" rx="6" fill="#f5f8f6" stroke="#d6e3dc"/><text x="436" y="362" font-size="16" fill="#183d33" font-weight="400">Previous hash → hash</text><path d="M706 355H756" fill="none" stroke="#13685a" stroke-width="2" marker-end="url(#arrow)"/><rect x="768" y="210" width="288" height="92" rx="10" fill="#f8ecd0" stroke="#d6e3dc"/><text x="788" y="248" font-size="18" fill="#183d33" font-weight="600">Approved · #003</text><text x="788" y="276" font-size="14" fill="#597168" font-weight="400">Actor · action · version</text><rect x="768" y="328" width="288" height="54" rx="6" fill="#f5f8f6" stroke="#d6e3dc"/><text x="788" y="362" font-size="16" fill="#183d33" font-weight="400">Previous hash → hash</text><text x="64" y="461" font-size="18" fill="#13685a" font-weight="600">Verify the supplied chain before relying on its integrity</text><text x="64" y="589" font-size="14" fill="#597168" font-weight="400">Durable storage and external checkpoints are customer-owned</text><text x="64" y="612" font-size="11" fill="#597168" font-weight="600">WTS CALENDAR  /  PREMIUM  /  STATIC ILLUSTRATION</text></svg>
