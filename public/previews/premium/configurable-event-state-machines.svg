<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">Only valid transitions move the event</title><desc id="desc">A sample machine with an explicit cancellation branch. Draft, In review, Approved, Cancelled. Static illustration, not a live calendar or product screenshot.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#13685a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="1" y="1" width="1118" height="638" rx="18" fill="#f7faf7" stroke="#d6e3dc"/><rect x="24" y="24" width="1072" height="592" rx="14" fill="#fff" stroke="#d6e3dc"/><text x="64" y="86" font-size="27" fill="#183d33" font-weight="600">Only valid transitions move the event</text><text x="64" y="122" font-size="18" fill="#597168" font-weight="400">A sample machine with an explicit cancellation branch</text><rect x="64" y="216" width="280" height="92" rx="10" fill="#d9ece2" stroke="#d6e3dc"/><text x="84" y="254" font-size="18" fill="#183d33" font-weight="600">Draft</text><text x="84" y="282" font-size="14" fill="#597168" font-weight="400">Initial state</text><rect x="422" y="216" width="280" height="92" rx="10" fill="#e2eaf6" stroke="#d6e3dc"/><text x="442" y="254" font-size="18" fill="#183d33" font-weight="600">In review</text><text x="442" y="282" font-size="14" fill="#597168" font-weight="400">Guarded transition</text><rect x="780" y="216" width="276" height="92" rx="10" fill="#d9ece2" stroke="#d6e3dc"/><text x="800" y="254" font-size="18" fill="#183d33" font-weight="600">Approved</text><text x="800" y="282" font-size="14" fill="#597168" font-weight="400">Accepted state</text><path d="M346 262H408M704 262H766" fill="none" stroke="#13685a" stroke-width="2" marker-end="url(#arrow)"/><rect x="422" y="422" width="280" height="92" rx="10" fill="#ece4f3" stroke="#d6e3dc"/><text x="442" y="460" font-size="18" fill="#183d33" font-weight="600">Cancelled</text><text x="442" y="488" font-size="14" fill="#597168" font-weight="400">Allowed cancellation</text><path d="M204 310V468H408M560 310V408" fill="none" stroke="#597168" stroke-width="2" marker-end="url(#arrow)"/><text x="64" y="589" font-size="14" fill="#597168" font-weight="400">Sample data · feature concept, not a product screenshot</text><text x="64" y="612" font-size="11" fill="#597168" font-weight="600">WTS CALENDAR  /  PREMIUM  /  STATIC ILLUSTRATION</text></svg>
