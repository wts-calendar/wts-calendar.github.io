<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">Choose how excess demand is handled</title><desc id="desc">The decision includes a reason, not just a boolean. Block, Warn, Allow, Proposed load: 110%. Static illustration, not a live calendar or product screenshot.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#13685a"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect x="1" y="1" width="1118" height="638" rx="18" fill="#f7faf7" stroke="#d6e3dc"/><rect x="24" y="24" width="1072" height="592" rx="14" fill="#fff" stroke="#d6e3dc"/><text x="64" y="86" font-size="27" fill="#183d33" font-weight="600">Choose how excess demand is handled</text><text x="64" y="122" font-size="18" fill="#597168" font-weight="400">The decision includes a reason, not just a boolean</text><text x="64" y="202" font-size="24" fill="#183d33" font-weight="600">Proposed load: 110%</text><rect x="64" y="270" width="316" height="92" rx="10" fill="#f4ded8" stroke="#d6e3dc"/><text x="84" y="308" font-size="18" fill="#183d33" font-weight="600">Block</text><text x="84" y="336" font-size="14" fill="#597168" font-weight="400">Reject proposal</text><rect x="402" y="270" width="316" height="92" rx="10" fill="#f8ecd0" stroke="#d6e3dc"/><text x="422" y="308" font-size="18" fill="#183d33" font-weight="600">Warn</text><text x="422" y="336" font-size="14" fill="#597168" font-weight="400">Continue with warning</text><rect x="740" y="270" width="316" height="92" rx="10" fill="#d9ece2" stroke="#d6e3dc"/><text x="760" y="308" font-size="18" fill="#183d33" font-weight="600">Allow</text><text x="760" y="336" font-size="14" fill="#597168" font-weight="400">Continue with issues</text><text x="64" y="439" font-size="22" fill="#13685a" font-weight="600">Typed issue + severity + decision</text><text x="64" y="589" font-size="14" fill="#597168" font-weight="400">Sample data · feature concept, not a product screenshot</text><text x="64" y="612" font-size="11" fill="#597168" font-weight="600">WTS CALENDAR  /  PREMIUM  /  STATIC ILLUSTRATION</text></svg>
